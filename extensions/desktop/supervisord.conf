; Every program runs as japa and restarts until it is up (those that need X fail until Xvfb answers). A stop or restart
; (japa's watchdog restarts a part that stops answering) signals its whole process group, so no child is left behind.

[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x24 -nolisten tcp -s 0
user=japa
environment=HOME="/home/japa",USER="japa",DISPLAY=":1"
autorestart=true
startretries=1000
stopasgroup=true
killasgroup=true

[program:xfce]
command=dbus-launch --exit-with-session startxfce4
user=japa
environment=HOME="/home/japa",USER="japa",DISPLAY=":1"
autorestart=true
startretries=1000
stopasgroup=true
killasgroup=true

; --disable-crashpad-for-testing: no crash handler (--disable-breakpad doesn't stop it). To dump a crashed process the
; handler attaches to it, and once it never let a dead GPU process go: the browser then waited for it forever, frozen.
; Its dumps are never sent anyway.
[program:chromium]
command=bash -c "rm -f /home/japa/.config/chromium/Singleton*; exec chromium --no-sandbox --no-first-run --no-default-browser-check --password-store=basic --start-maximized --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --user-data-dir=/home/japa/.config/chromium --disable-crashpad-for-testing"
user=japa
environment=HOME="/home/japa",USER="japa",DISPLAY=":1"
autorestart=true
startretries=1000
stopasgroup=true
killasgroup=true

[program:cdp]
command=socat TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222
user=japa
environment=HOME="/home/japa",USER="japa",DISPLAY=":1"
autorestart=true
startretries=1000
stopasgroup=true
killasgroup=true

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -localhost -rfbport 5900 -passwd %(ENV_VNC_PASSWORD)s
user=japa
environment=HOME="/home/japa",USER="japa",DISPLAY=":1"
autorestart=true
startretries=1000
stopasgroup=true
killasgroup=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
user=japa
environment=HOME="/home/japa",USER="japa",DISPLAY=":1"
autorestart=true
startretries=1000
stopasgroup=true
killasgroup=true
